<style>
  /* ============================================ */
  /* GMAIL-STYLE MODERN UI - CompTime Tracker */
  /* ============================================ */

  /* CSS Variables for Easy Theming */
  :root {
    --primary-color: #1a73e8;
    --primary-hover: #1557b0;
    --primary-light: #e8f0fe;
    --danger-color: #ea4335;
    --danger-light: #fce8e6;
    --success-color: #34a853;
    --success-light: #e6f4ea;
    --warning-color: #fbbc04;
    --warning-light: #fef7e0;
    --gray-50: #fafafa;
    --gray-100: #f5f5f5;
    --gray-200: #e8eaed;
    --gray-300: #dadce0;
    --gray-400: #bdc1c6;
    --gray-500: #9aa0a6;
    --gray-600: #80868b;
    --gray-700: #5f6368;
    --gray-800: #3c4043;
    --gray-900: #202124;
    --text-primary: #202124;
    --text-secondary: #5f6368;
    --text-tertiary: #80868b;
    --border-color: #dadce0;
    --shadow-sm: 0 1px 2px 0 rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
    --shadow-md: 0 1px 3px 0 rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15);
    --shadow-lg: 0 2px 6px 2px rgba(60,64,67,.15), 0 8px 24px 4px rgba(60,64,67,.15);
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
  }

  * {
    box-sizing: border-box;
  }

  body {
    font-family: 'Google Sans', 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background-color: #fff;
    color: var(--text-primary);
    margin: 0;
    padding: 0;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ============================================ */
  /* NAVIGATION - Gmail Style */
  /* ============================================ */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background-color: #fff;
    border-bottom: 1px solid var(--border-color);
    padding: 8px 16px;
    box-shadow: none;
    transition: box-shadow 0.2s ease;
  }

  .navbar.scrolled {
    box-shadow: var(--shadow-sm);
  }

  .navbar-brand {
    font-weight: 500;
    font-size: 22px;
    color: var(--gray-700) !important;
    letter-spacing: -0.2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .navbar-brand i {
    color: var(--primary-color);
    font-size: 24px;
  }

  .nav-link {
    color: var(--gray-700) !important;
    font-weight: 500;
    padding: 8px 16px !important;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: var(--radius-lg);
    margin: 0 2px;
    font-size: 14px;
    position: relative;
  }

  .nav-link:hover {
    background-color: var(--gray-100);
    color: var(--gray-900) !important;
  }

  .nav-link.active {
    background-color: var(--primary-light);
    color: var(--primary-color) !important;
  }

  .dropdown-menu {
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-md);
    border-radius: var(--radius-md);
    padding: 8px 0;
    margin-top: 8px;
    min-width: 200px;
  }

  .dropdown-item {
    border-radius: 0;
    padding: 10px 24px;
    font-size: 14px;
    transition: background-color 0.15s ease;
    color: var(--text-primary);
    font-weight: 400;
  }

  .dropdown-item:hover {
    background-color: var(--gray-100);
    color: var(--text-primary);
  }

  .dropdown-item:active {
    background-color: var(--gray-200);
  }

  /* ============================================ */
  /* LAYOUT & CONTAINERS */
  /* ============================================ */
  .content-wrapper {
    padding: 24px 40px;
    min-height: calc(100vh - 70px);
    background-color: #fff;
    max-width: 1400px;
    margin: 0 auto;
  }

  .page-view {
    display: none;
  }

  .page-view.active {
    display: block;
    animation: fadeInUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ============================================ */
  /* CARDS - Material Design Style */
  /* ============================================ */
  .card {
    border: 1px solid var(--border-color);
    box-shadow: none;
    border-radius: var(--radius-md);
    margin-bottom: 16px;
    background-color: #fff;
    transition: box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .card:hover {
    box-shadow: var(--shadow-sm);
  }

  .card-header {
    background-color: #fff;
    border-bottom: 1px solid var(--border-color);
    font-weight: 500;
    padding: 16px 20px;
    border-radius: var(--radius-md) var(--radius-md) 0 0;
    color: var(--text-primary);
    font-size: 14px;
  }

  .card-header h5 {
    margin: 0;
    font-size: 16px;
    font-weight: 500;
    color: var(--text-primary);
  }

  .card-body {
    padding: 20px;
  }

  /* ============================================ */
  /* STAT CARDS - Clean & Modern */
  /* ============================================ */
  .stat-card {
    padding: 24px 20px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
    margin-bottom: 16px;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    background-color: #fff;
    box-shadow: none;
  }

  .stat-card:hover {
    box-shadow: var(--shadow-sm);
    transform: translateY(-2px);
  }

  .stat-card h3 {
    font-size: 32px;
    font-weight: 500;
    margin-bottom: 4px;
    color: var(--text-primary);
  }

  .stat-card p {
    margin: 0;
    font-size: 14px;
    color: var(--text-secondary);
    font-weight: 400;
  }

  .stat-card.blue {
    background-color: var(--primary-light);
    border-color: #a8c7fa;
  }

  .stat-card.blue h3 {
    color: var(--primary-color);
  }

  .stat-card.green {
    background-color: var(--success-light);
    border-color: #81c995;
  }

  .stat-card.green h3 {
    color: var(--success-color);
  }

  .stat-card.orange {
    background-color: var(--warning-light);
    border-color: #fdd663;
  }

  .stat-card.orange h3 {
    color: #ea8600;
  }

  .stat-card.violet {
    background-color: #f3e8ff;
    border-color: #d4b5f6;
  }

  .stat-card.violet h3 {
    color: #8430ce;
  }

  /* ============================================ */
  /* BUTTONS - Gmail Style */
  /* ============================================ */
  .btn {
    font-family: 'Google Sans', 'Roboto', sans-serif;
    font-weight: 500;
    font-size: 14px;
    padding: 8px 24px;
    border-radius: var(--radius-md);
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    border: none;
    outline: none;
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background-color: rgba(255, 255, 255, 0.3);
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
  }

  .btn:active::before {
    width: 300px;
    height: 300px;
  }

  .btn-primary {
    background-color: var(--primary-color);
    color: #fff;
    box-shadow: none;
  }

  .btn-primary:hover {
    background-color: var(--primary-hover);
    box-shadow: var(--shadow-sm);
  }

  .btn-primary:active {
    background-color: #1146a6;
  }

  .btn-primary:disabled {
    background-color: var(--gray-300);
    color: var(--gray-500);
    cursor: not-allowed;
  }

  .btn-secondary {
    background-color: #fff;
    color: var(--text-primary);
    border: 1px solid var(--border-color);
  }

  .btn-secondary:hover {
    background-color: var(--gray-100);
    border-color: var(--gray-400);
  }

  .btn-secondary:active {
    background-color: var(--gray-200);
  }

  .btn-sm {
    padding: 6px 16px;
    font-size: 13px;
  }

  .btn-outline-primary {
    border: 1px solid var(--primary-color);
    color: var(--primary-color);
    background-color: #fff;
  }

  .btn-outline-primary:hover {
    background-color: var(--primary-light);
    border-color: var(--primary-color);
    color: var(--primary-color);
  }

  .btn-outline-danger {
    border: 1px solid var(--danger-color);
    color: var(--danger-color);
    background-color: #fff;
  }

  .btn-outline-danger:hover {
    background-color: var(--danger-light);
    border-color: var(--danger-color);
    color: var(--danger-color);
  }

  .btn-gradient {
    background: var(--primary-color);
    color: #fff;
    border: none;
    padding: 10px 28px;
    font-weight: 500;
    box-shadow: var(--shadow-sm);
  }

  .btn-gradient:hover {
    background: var(--primary-hover);
    box-shadow: var(--shadow-md);
    color: #fff;
  }

  /* ============================================ */
  /* FORMS - Clean Material Design */
  /* ============================================ */
  .form-label {
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 8px;
    font-size: 13px;
  }

  .form-control,
  .form-select {
    border: 1px solid var(--border-color);
    padding: 10px 12px;
    font-size: 14px;
    border-radius: var(--radius-sm);
    transition: all 0.2s ease;
    color: var(--text-primary);
    background-color: #fff;
  }

  .form-control:hover,
  .form-select:hover {
    border-color: var(--gray-500);
  }

  .form-control:focus,
  .form-select:focus {
    border-color: var(--primary-color);
    box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.1);
    outline: none;
    background-color: #fff;
  }

  .form-control.is-invalid,
  .form-select.is-invalid {
    border-color: var(--danger-color);
    background-color: var(--danger-light);
  }

  .form-control.is-invalid:focus,
  .form-select.is-invalid:focus {
    border-color: var(--danger-color);
    box-shadow: 0 0 0 4px rgba(234, 67, 53, 0.1);
  }

  .invalid-feedback {
    display: none;
    margin-top: 6px;
    font-size: 12px;
    color: var(--danger-color);
  }

  .form-control.is-invalid ~ .invalid-feedback,
  .form-select.is-invalid ~ .invalid-feedback {
    display: block;
  }

  /* ============================================ */
  /* MODALS - Gmail Style Overlay */
  /* ============================================ */
  .modal-backdrop {
    background-color: rgba(32, 33, 36, 0.6);
    backdrop-filter: blur(2px);
  }

  .modal-backdrop.show {
    opacity: 1;
  }

  .modal.fade .modal-dialog {
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    transform: scale(0.95) translateY(-20px);
    opacity: 0;
  }

  .modal.show .modal-dialog {
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  .modal-content {
    border: none;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
  }

  .modal-header {
    background-color: #fff;
    border-bottom: 1px solid var(--border-color);
    padding: 20px 24px;
  }

  .modal-title {
    font-weight: 500;
    color: var(--text-primary);
    font-size: 20px;
  }

  .modal-body {
    padding: 24px;
    max-height: calc(100vh - 200px);
    overflow-y: auto;
  }

  .modal-body::-webkit-scrollbar {
    width: 8px;
  }

  .modal-body::-webkit-scrollbar-track {
    background: var(--gray-100);
  }

  .modal-body::-webkit-scrollbar-thumb {
    background: var(--gray-400);
    border-radius: 4px;
  }

  .modal-body::-webkit-scrollbar-thumb:hover {
    background: var(--gray-500);
  }

  .modal-footer {
    border-top: 1px solid var(--border-color);
    padding: 16px 24px;
    background-color: #fff;
  }

  .btn-close {
    opacity: 0.5;
    transition: opacity 0.2s ease;
  }

  .btn-close:hover {
    opacity: 1;
  }

  /* Universal Modal - Gmail Style Alerts */
  #universalModal .modal-dialog {
    max-width: 420px;
  }

  #universalModal .modal-content {
    border-radius: var(--radius-xl);
  }

  #universalModal .modal-body {
    padding: 32px 24px 24px;
  }

  #universalModal .modal-footer {
    border-top: none;
    padding: 0 24px 24px;
  }

  /* ============================================ */
  /* TABLES - Clean & Minimal */
  /* ============================================ */
  .table {
    color: var(--text-primary);
    font-size: 14px;
  }

  .table-hover tbody tr {
    transition: background-color 0.15s ease;
  }

  .table-hover tbody tr:hover {
    background-color: var(--gray-50);
  }

  .table thead th {
    background-color: #fff;
    border-bottom: 2px solid var(--border-color);
    font-weight: 500;
    color: var(--text-secondary);
    padding: 12px 16px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .table tbody td {
    padding: 12px 16px;
    vertical-align: middle;
    border-bottom: 1px solid var(--gray-200);
  }

  .table-modern thead th {
    background-color: var(--gray-50);
    border-bottom: 1px solid var(--border-color);
  }

  /* ============================================ */
  /* BADGES */
  /* ============================================ */
  .badge {
    padding: 4px 12px;
    font-weight: 500;
    font-size: 12px;
    border-radius: 12px;
  }

  /* ============================================ */
  /* ALERTS & NOTIFICATIONS */
  /* ============================================ */
  .alert-item {
    border-left: 4px solid;
    background-color: #fff;
    padding: 16px 20px;
    margin-bottom: 12px;
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-color);
  }

  .alert-item.warning {
    border-left-color: var(--danger-color);
    background-color: var(--danger-light);
    border-color: #f6aea9;
  }

  .alert-item.info {
    border-left-color: var(--primary-color);
    background-color: var(--primary-light);
    border-color: #a8c7fa;
  }

  .alert-info {
    background-color: var(--primary-light);
    border: 1px solid #a8c7fa;
    border-radius: var(--radius-md);
    color: #174ea6;
  }

  .alert-warning {
    background-color: var(--warning-light);
    border: 1px solid #fdd663;
    border-radius: var(--radius-md);
    color: #77370b;
  }

  /* ============================================ */
  /* NAVIGATION TABS */
  /* ============================================ */
  .nav-tabs {
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 20px;
  }

  .nav-tabs .nav-link {
    border: none;
    color: var(--text-secondary) !important;
    font-weight: 500;
    padding: 12px 24px;
    margin: 0;
    border-radius: 0;
    border-bottom: 2px solid transparent;
    transition: all 0.2s ease;
    background-color: transparent !important;
    font-size: 14px;
  }

  .nav-tabs .nav-link:hover {
    background-color: var(--gray-50) !important;
    border-bottom-color: var(--gray-300);
    color: var(--text-primary) !important;
  }

  .nav-tabs .nav-link.active {
    background-color: transparent !important;
    color: var(--primary-color) !important;
    border-bottom-color: var(--primary-color);
  }

  /* ============================================ */
  /* SEARCH BOX */
  /* ============================================ */
  .search-box {
    position: relative;
    margin-bottom: 16px;
  }

  .search-box .form-control {
    padding-left: 40px;
    background-color: var(--gray-100);
    border: 1px solid transparent;
    transition: all 0.2s ease;
  }

  .search-box .form-control:hover {
    background-color: #fff;
    border-color: var(--border-color);
  }

  .search-box .form-control:focus {
    background-color: #fff;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.1);
  }

  .search-box .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-tertiary);
    font-size: 18px;
    pointer-events: none;
  }

  .search-box .clear-search {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-tertiary);
    cursor: pointer;
    padding: 4px;
    display: none;
    border-radius: 50%;
    transition: all 0.2s ease;
  }

  .search-box .clear-search:hover {
    background-color: var(--gray-200);
    color: var(--text-secondary);
  }

  .search-box .clear-search.visible {
    display: block;
  }

  /* ============================================ */
  /* LOADING STATES */
  /* ============================================ */
  .loading {
    text-align: center;
    padding: 48px 16px;
    color: var(--text-tertiary);
  }

  #ot-entry-loading {
    display: none;
  }

  #ot-entry-loading.active {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 32px 16px;
    color: var(--text-secondary);
  }

  /* ============================================ */
  /* PAGE TITLE */
  /* ============================================ */
  .page-title {
    font-weight: 400;
    color: var(--text-primary);
    margin-bottom: 20px;
    font-size: 24px;
    letter-spacing: 0;
  }

  /* ============================================ */
  /* USER INFO */
  /* ============================================ */
  .user-info {
    color: var(--text-primary);
    font-weight: 400;
    padding: 8px 16px;
    background-color: var(--gray-100);
    border-radius: var(--radius-lg);
    font-size: 14px;
  }

  .user-info i {
    color: var(--primary-color);
    margin-right: 8px;
  }

  /* ============================================ */
  /* DROPDOWN SELECT */
  /* ============================================ */
  .searchable-select-container {
    position: relative;
  }

  .searchable-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid var(--border-color);
    border-top: none;
    border-radius: 0 0 var(--radius-sm) var(--radius-sm);
    max-height: 300px;
    overflow-y: auto;
    z-index: 1000;
    box-shadow: var(--shadow-md);
    margin-top: -1px;
  }

  .searchable-dropdown::-webkit-scrollbar {
    width: 8px;
  }

  .searchable-dropdown::-webkit-scrollbar-track {
    background: var(--gray-100);
  }

  .searchable-dropdown::-webkit-scrollbar-thumb {
    background: var(--gray-400);
    border-radius: 4px;
  }

  .dropdown-list {
    padding: 4px 0;
  }

  .dropdown-item-custom {
    padding: 10px 16px;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }

  .dropdown-item-custom:hover {
    background-color: var(--gray-100);
  }

  .dropdown-item-custom.selected {
    background-color: var(--primary-light);
    color: var(--primary-color);
    font-weight: 500;
  }

  .dropdown-item-custom .employee-name {
    font-weight: 400;
    color: var(--text-primary);
    display: block;
  }

  .dropdown-item-custom .employee-details {
    font-size: 12px;
    color: var(--text-secondary);
    display: block;
    margin-top: 2px;
  }

  .dropdown-no-results {
    padding: 16px;
    text-align: center;
    color: var(--text-tertiary);
    font-style: italic;
    font-size: 13px;
  }

  /* ============================================ */
  /* ANIMATIONS */
  /* ============================================ */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  input[type="time"].is-invalid,
  input[type="time"].border-danger {
    border-width: 2px;
    animation: shake 0.3s ease-in-out;
  }

  .border-danger {
    border-color: var(--danger-color) !important;
    background-color: var(--danger-light) !important;
  }

  .border-danger:focus {
    border-color: var(--danger-color) !important;
    box-shadow: 0 0 0 4px rgba(234, 67, 53, 0.1) !important;
  }

  /* ============================================ */
  /* RESPONSIVE ADJUSTMENTS */
  /* ============================================ */
  @media (max-width: 768px) {
    .content-wrapper {
      padding: 16px 20px;
    }

    .page-title {
      font-size: 20px;
    }

    .stat-card h3 {
      font-size: 28px;
    }

    .modal-body {
      padding: 20px;
    }
  }

  /* ============================================ */
  /* UTILITY CLASSES */
  /* ============================================ */
  .text-primary { color: var(--primary-color) !important; }
  .text-danger { color: var(--danger-color) !important; }
  .text-success { color: var(--success-color) !important; }
  .text-warning { color: #ea8600 !important; }
  .text-muted { color: var(--text-secondary) !important; }

  .bg-primary { background-color: var(--primary-color) !important; }
  .bg-light { background-color: var(--gray-50) !important; }

  /* ============================================ */
  /* SPINNER */
  /* ============================================ */
  .spinner-border {
    border-width: 2px;
  }
</style>
